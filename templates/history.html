<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Timeline | AetherCura</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-1:#040b16;
            --bg-2:#071525;
            --bg-3:#0b1f34;
            --panel:rgba(255,255,255,0.07);
            --border:rgba(255,255,255,0.14);
            --text:#eaf4ff;
            --muted:#9bb0c7;
            --primary:#00d4ff;
            --secondary:#14f1c7;
        }

        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:'Inter',sans-serif;
            min-height:100vh;
            color:var(--text);
            background:
                radial-gradient(circle at 12% 18%, rgba(0,212,255,0.18), transparent 28%),
                radial-gradient(circle at 82% 12%, rgba(20,241,199,0.16), transparent 24%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2) 48%, var(--bg-3));
            padding:30px 18px;
        }

        .wrap{
            max-width:980px;
            margin:auto;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            margin-bottom:24px;
        }

        h2{
            font-family:'Orbitron',sans-serif;
            font-size:28px;
        }

        .back-btn{
            text-decoration:none;
            color:white;
            padding:12px 16px;
            border-radius:14px;
            background:linear-gradient(135deg, rgba(0,212,255,.20), rgba(20,241,199,.16));
            border:1px solid rgba(255,255,255,.10);
        }

        .timeline{
            position:relative;
            padding-left:32px;
        }

        .timeline::before{
            content:"";
            position:absolute;
            left:9px;
            top:0;
            bottom:0;
            width:3px;
            border-radius:20px;
            background:linear-gradient(180deg, rgba(0,212,255,.7), rgba(20,241,199,.4));
        }

        .node{
            position:relative;
            margin-bottom:18px;
        }

        .node::before{
            content:"";
            position:absolute;
            left:-28px;
            top:24px;
            width:14px;
            height:14px;
            border-radius:50%;
            background:linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow:0 0 14px rgba(0,212,255,.45);
        }

        .card{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:22px;
            padding:18px;
            backdrop-filter:blur(14px);
        }

        .title{
            font-size:18px;
            font-weight:800;
            margin-bottom:8px;
        }

        .meta{
            color:var(--muted);
            font-size:13px;
            line-height:1.7;
            margin-bottom:14px;
        }

        .actions{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .actions a{
            text-decoration:none;
            color:#dffcff;
            padding:10px 14px;
            border-radius:12px;
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.08);
            font-size:13px;
            font-weight:700;
        }

        .empty{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:22px;
            padding:20px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <h2>Consultation Timeline</h2>
            <a class="back-btn" href="{{ url_for('chat_page') }}">← Back to Chat</a>
        </div>

        <div class="timeline">
            {% for chat in chat_sessions %}
                <div class="node">
                    <div class="card">
                        <div class="title">{{ chat['title'] }}</div>
                        <div class="meta">
                            Created: {{ chat['created_at'] }}<br>
                            Updated: {{ chat['updated_at'] }}
                        </div>
                        <div class="actions">
                            <a href="{{ url_for('load_chat', session_id=chat['_id']) }}">Open Consultation</a>
                            <a href="{{ url_for('download_report', session_id=chat['_id']) }}">Download Report</a>
                        </div>
                    </div>
                </div>
            {% else %}
                <div class="empty">No consultation history found yet.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
